<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest1.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/app1-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/app1-192.png">
<title>Random Machine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --indigo-950:#312e81;--indigo-700:#4f46e5;--amber-400:#f59e0b;
  --bg:#1e1b4b;--card:#312e81;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 50px) 16px calc(var(--safe-b) + 16px);
}

/* Status bar */
.status-bar{
  position:fixed;top:0;left:0;right:0;
  padding:max(12px,var(--safe-t)) 20px 12px;
  display:flex;align-items:center;
  background:rgba(49,46,129,.85);backdrop-filter:blur(10px);
  z-index:100;
}
.status-dot{width:10px;height:10px;border-radius:50%;background:#6b7280;transition:.3s;flex-shrink:0}
.status-dot.connected{background:#22c55e;box-shadow:0 0 8px #22c55e}
.status-text{color:#a5b4fc;font-size:clamp(11px,3vw,13px);margin-left:8px}

/* Main number box — ไม่มีกรอบ โปร่งใส */
.number-box{
  position:relative;
  width:clamp(180px,55vmin,320px);
  height:clamp(180px,55vmin,320px);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:clamp(20px,5vh,40px);
  cursor:pointer;
}
.number-display{
  font-size:clamp(200px, 85vw, 500px);
  font-weight:800;line-height:1;
}
.number-display.spinning{animation:spin .06s linear infinite}
@keyframes spin{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

/* Buttons */
.btn{
  width:clamp(200px,55vmin,320px);
  padding:clamp(14px,3vh,20px);
  border:none;border-radius:clamp(12px,2vmin,18px);
  font-size:clamp(15px,4vw,20px);font-weight:700;
  cursor:pointer;transition:.15s;
  -webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(.95)}
.btn-random{background:var(--indigo-700);color:#fff;box-shadow:0 8px 24px rgba(79,70,229,.4)}
.btn-random:disabled{opacity:.4;cursor:not-allowed}
.btn-reset{background:transparent;color:#818cf8;border:2px solid #4f46e5}

/* Landscape — ตัวเลขบน ปุ่มล่าง */
@media (orientation:landscape) and (max-height:520px){
  body{gap:clamp(6px,2vh,14px);padding-top:calc(var(--safe-t) + 36px);padding-bottom:calc(var(--safe-b) + 8px)}
  .number-box{width:clamp(160px,50vh,300px);height:clamp(160px,50vh,300px);margin-bottom:0}
  .number-display{font-size:clamp(110px,50vh,240px)}
  .btn{width:clamp(200px,50vw,420px);padding:clamp(10px,2.5vh,16px) clamp(28px,5vw,48px)}
  .settings-icon{width:38px;height:38px}
  .settings-icon svg{width:20px;height:20px}
}

/* Settings */
.settings-icon{
  position:fixed;bottom:max(16px,var(--safe-b));right:16px;
  width:44px;height:44px;border-radius:50%;
  background:rgba(79,70,229,.3);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:100;
}
.settings-icon svg{width:24px;height:24px;fill:#a5b4fc}
.settings-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.settings-modal.show{display:flex}
.settings-card{background:#3730a3;border-radius:24px;padding:28px;width:100%;max-width:340px}
.settings-card h2{font-size:20px;margin-bottom:16px}
.settings-card label{display:block;font-size:13px;color:#a5b4fc;margin-bottom:6px}
.settings-card input{width:100%;padding:12px;border-radius:10px;border:2px solid #4f46e5;background:#1e1b4b;color:#fff;font-size:15px;margin-bottom:12px}
.settings-card input:focus{outline:none;border-color:#818cf8}
.settings-card .btn{width:100%;margin-top:8px}
.test-result{font-size:13px;margin-top:8px;text-align:center}
</style>
</head>
<body>

<div class="number-box" id="numBox">
  <div class="number-display" id="numDisplay">?</div>
</div>

<button class="btn btn-random" id="btnRandom">🎰 สุ่มเลย</button>

<div class="settings-icon" id="settingsIcon">
  <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
</div>

<div class="settings-modal" id="settingsModal">
  <div class="settings-card">
    <h2>⚙️ ตั้งค่า</h2>
    <label>Server URL</label>
    <input type="text" id="serverUrl" placeholder="https://...">
    <button class="btn btn-random" id="btnTest">ทดสอบการเชื่อมต่อ</button>
    <div class="test-result" id="testResult"></div>
    <button class="btn btn-reset" id="btnCloseSettings" style="margin-top:12px">ปิด</button>
  </div>
</div>

<script>
let ws=null;
let wsReconnectTimer=null;
let serverState={target:null,lastResult:null,locked:false,bgColor:null};
let isSpinning=false;
let baseUrl=localStorage.getItem('serverUrl')||'https://random-sync-server.onrender.com';

const numDisplay=document.getElementById('numDisplay');
const numBox=document.getElementById('numBox');
const btnRandom=document.getElementById('btnRandom');
const settingsIcon=document.getElementById('settingsIcon');
const settingsModal=document.getElementById('settingsModal');
const serverUrlInput=document.getElementById('serverUrl');
const btnTest=document.getElementById('btnTest');
const testResult=document.getElementById('testResult');
const btnCloseSettings=document.getElementById('btnCloseSettings');

function connectWS(){
  if(ws&&(ws.readyState===0||ws.readyState===1))return;
  if(!baseUrl)return;
  const wsUrl=baseUrl.replace(/^http/,'ws').replace(/^https/,'wss');
  try{ws=new WebSocket(wsUrl);}catch(e){scheduleReconnect();return;}
  ws.onopen=()=>{};
  ws.onmessage=(e)=>{const m=JSON.parse(e.data);if(m.event==='state_update'){serverState=m.data;applyColor();}};
  ws.onclose=()=>{ws=null;scheduleReconnect();};
  ws.onerror=()=>{};
}

function scheduleReconnect(){
  if(wsReconnectTimer)return;
  wsReconnectTimer=setTimeout(()=>{wsReconnectTimer=null;connectWS();},2000);
}

function applyColor(){
  document.body.style.background=serverState.bgColor||'';
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function fetchTarget(){
  // ลองดึง target จาก server สูงสุด 3 ครั้ง
  for(let i=0;i<3;i++){
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),5000);
      const res=await fetch(baseUrl+'/state',{cache:'no-store',signal:controller.signal});
      clearTimeout(timer);
      if(res.ok){const s=await res.json();return s.target;}
    }catch(e){}
    await sleep(500);
  }
  return null;
}

async function doRandom(){
  if(isSpinning)return;
  isSpinning=true;
  btnRandom.disabled=true;
  // ดึง target ก่อนเริ่มหมุน — ถ้า server หลับจะได้รอตื่น
  let target=await fetchTarget();
  if(target===null)target=serverState.target;
  // เริ่มหมุน
  numDisplay.classList.add('spinning');
  const si=setInterval(()=>{numDisplay.textContent=Math.floor(Math.random()*15)+1;},60);
  await sleep(1000);
  clearInterval(si);
  numDisplay.classList.remove('spinning');
  let result=(target!==null)?target:Math.floor(Math.random()*15)+1;
  numDisplay.textContent=result;
  // ส่งผลกลับ server
  for(let i=0;i<3;i++){
    try{
      const res=await fetch(baseUrl+'/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:result})});
      if(res.ok)break;
    }catch(e){}
    await sleep(500);
  }
  // sync state ใหม่
  try{const res=await fetch(baseUrl+'/state',{cache:'no-store'});if(res.ok){const s=await res.json();serverState=s;applyColor();}}catch(e){}
  isSpinning=false;
  btnRandom.disabled=false;
}

// แตะที่ไหนก็ได้บนหน้าจอ = สุ่ม (ยกเว้นปุ่มตั้งค่า/หน้าต่างตั้งค่า)
document.addEventListener('click',(e)=>{
  if(e.target.closest('.settings-icon')||e.target.closest('.settings-modal'))return;
  doRandom();
});
settingsIcon.addEventListener('click',()=>{settingsModal.classList.add('show');serverUrlInput.value=baseUrl;});
btnCloseSettings.addEventListener('click',()=>{settingsModal.classList.remove('show');});
btnTest.addEventListener('click',async()=>{
  const url=serverUrlInput.value.trim().replace(/\/$/,'');
  testResult.textContent='กำลังทดสอบ...';testResult.style.color='#a5b4fc';
  try{
    const res=await fetch(url+'/state');
    if(res.ok){testResult.textContent='✅ เชื่อมต่อสำเร็จ!';testResult.style.color='#22c55e';baseUrl=url;localStorage.setItem('serverUrl',url);
      setTimeout(()=>{settingsModal.classList.remove('show');connectWS();},800);
    }else{testResult.textContent='❌ HTTP '+res.status;testResult.style.color='#ef4444';}
  }catch(e){testResult.textContent='❌ '+e.message;testResult.style.color='#ef4444';}
});

connectWS();
</script>
</body>
</html>
